# Alembic: versioned PostgreSQL migrations. See docs/layers/02-storage.md.
#
#   alembic upgrade head                                  # or: make init
#   alembic revision --autogenerate -m "add x to y"       # after changing storage/postgres/models.py
#   alembic downgrade -1
#
# The database URL is not set here: migrations/env.py reads DATABASE_URL (env / .env)
# through ledgerlens.core.config.Settings, like the app does. Override per run with
#   alembic -x url=postgresql+psycopg://... upgrade head

[alembic]
script_location = %(here)s/migrations
# Sortable file names: 0001_initial_schema.py, 0002_...
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
prepend_sys_path = .
path_separator = os
timezone = UTC

[post_write_hooks]
# Format generated migrations the way the rest of the repo is formatted.
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
