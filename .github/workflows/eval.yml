name: Eval

# The 40-question CI subset (make eval-ci) on pull requests that can change answer quality:
# retrieval, the agents and their prompts, model routing. See docs/layers/09-evaluation.md.
#
# It runs against hosted copies of the evaluation stores, given as repository secrets:
# EVAL_DATABASE_URL, EVAL_NEO4J_URI / _USER / _PASSWORD and PINECONE_API_KEY (vectors in the
# `eval` namespace), plus LLM keys (OPENAI_API_KEY, GOOGLE_API_KEY, MISTRAL_API_KEY) for
# answers and the RAGAS judge. Without the store secrets the job says so on the PR and passes:
# there is nothing to measure against.
on:
  pull_request:
    paths:
      - "src/ledgerlens/retrieval/**"
      - "src/ledgerlens/agents/**"  # includes the prompts (agents/prompts/*.md)
      - "configs/models.yaml"
      - "configs/retrieval.yaml"
      - "configs/eval.yaml"
      - "eval/runner.py"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # the results comment

jobs:
  eval-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX: ${{ vars.PINECONE_INDEX || 'ledgerlens-chunks' }}
      PINECONE_NAMESPACE: eval  # never the dev or prod vectors
      DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
      NEO4J_URI: ${{ secrets.EVAL_NEO4J_URI }}
      NEO4J_USER: ${{ secrets.EVAL_NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.EVAL_NEO4J_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the baseline is the newest report committed on the base branch
      - name: Check the evaluation stores are configured
        id: stores
        run: |
          missing=""
          [ -n "$PINECONE_API_KEY" ] || missing="$missing PINECONE_API_KEY"
          [ -n "$DATABASE_URL" ] || missing="$missing EVAL_DATABASE_URL"
          [ -n "$NEO4J_URI" ] || missing="$missing EVAL_NEO4J_URI"
          if [ -z "$missing" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "live=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Eval gate skipped: repository secrets not set:$missing"
          mkdir -p eval/reports/ci-run
          {
            echo "<!-- ledgerlens-eval-gate -->"
            echo "### :warning: Eval gate skipped"
            echo
            echo "The evaluation stores are not configured for this repository (missing secrets:$missing),"
            echo "so the CI subset could not run. See docs/layers/09-evaluation.md, \"CI regression gate\"."
          } > eval/reports/ci-run/comment.md
      - uses: actions/setup-python@v5
        if: steps.stores.outputs.live == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Hugging Face models (embedder and reranker)
        if: steps.stores.outputs.live == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-eval-models-v1
      - name: Install
        if: steps.stores.outputs.live == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[storage,ingestion,llm,agents,eval]"
      - name: Run the CI subset
        if: steps.stores.outputs.live == 'true'
        run: python -m eval.runner --set ci --no-db --report-dir eval/reports/ci-run
      - name: Compare with the base branch's last report
        if: steps.stores.outputs.live == 'true'
        id: gate
        continue-on-error: true  # post the comment first; the last step fails the job
        run: >-
          python -m eval.regression --current eval/reports/ci-run/summary_ci.json
          --base-ref origin/${{ github.base_ref || 'main' }}
          --comment eval/reports/ci-run/comment.md
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Post the results on the pull request
        # Fork PRs get a read-only token: their results stay in the job log and artifact.
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('eval/reports/ci-run/comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("eval/reports/ci-run/comment.md", "utf8");
            const marker = "<!-- ledgerlens-eval-gate -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find((c) => c.body && c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-ci-report
          path: eval/reports/ci-run/
          if-no-files-found: ignore
      - name: Fail on a regression
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::A gated metric regressed vs the base branch's last report (see the PR comment)."
          exit 1
