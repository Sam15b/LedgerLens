name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Tesseract (OCR tests run against the real binary)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr
      - name: Cache Hugging Face models (tiny test embedding model)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1
      - name: Install
        run: |
          # CPU-only PyTorch for sentence-transformers and Keras (the default wheel bundles CUDA, ~2 GB)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,storage,ingestion,synthetic,finetune,anomaly,agents,eval]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check (mypy --strict)
        run: mypy
      - name: Unit tests with coverage
        run: pytest tests/unit --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledgerlens
      PINECONE_HOST: http://localhost:5080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Tesseract (pipeline test OCRs the scanned receipt)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr
      - name: Install
        run: pip install -e ".[dev,storage,agents]"  # MCP record tools are tested against Postgres
      - name: Start services (same docker-compose.yml as local development)
        run: docker compose up -d --wait --wait-timeout 240 postgres neo4j redis pinecone-local
      - name: Wait for Pinecone Local
        run: >-
          curl --silent --show-error --fail --retry 20 --retry-connrefused --retry-delay 2
          -H "Api-Key: pclocal" -H "X-Pinecone-Api-Version: 2025-10"
          http://localhost:5080/indexes
      - name: Initialise stores
        run: |
          alembic upgrade head
          python scripts/create_pinecone_index.py
          python scripts/init_neo4j_schema.py
      - name: Integration tests
        run: pytest -m integration tests/integration
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop services
        if: always()
        run: docker compose down --volumes

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json  # the pnpm version pinned in packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: API types match web/openapi.json
        run: |
          pnpm gen:api
          git diff --exit-code -- lib/api-schema.ts || {
            echo "::error::lib/api-schema.ts is stale: run pnpm --dir web gen:api"
            exit 1
          }
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Component tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # Which parts changed: the compose smoke test only runs when the images could be affected.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'infra/docker/**'
              - 'docker-compose*.yml'
              - '.dockerignore'
              - 'web/.dockerignore'
              - 'pyproject.toml'
              - 'configs/**'
              - 'migrations/**'
              - 'scripts/**'
              - 'src/ledgerlens/api/**'
              - 'src/ledgerlens/core/**'
              - 'src/ledgerlens/storage/**'
              - 'web/package.json'
              - 'web/pnpm-lock.yaml'
              - 'web/next.config.ts'
              - 'web/proxy.ts'
              - 'web/app/**'
              - 'web/lib/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/aws/**'
              - '.github/workflows/ci.yml'

  # The AWS Terraform: formatting, validity, and `terraform test`, which plans the whole
  # configuration against mocked providers (no AWS account or credentials involved).
  terraform:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    env:
      TF_IN_AUTOMATION: "1"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.17.0"
          terraform_wrapper: false
      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: .terraform-plugins
          key: terraform-providers-${{ hashFiles('infra/aws/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Format check
        run: terraform fmt -check -recursive -diff
      - name: Init (no backend)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Plan tests (mocked providers)
        run: terraform test

  # Build every image and bring the whole stack up as `docker compose up` would (without the
  # dev override), then check it answers: the API's health and its key, the dashboard's
  # login gate, and the dashboard reaching the API through its /api forwarder.
  compose:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_KEYS: ci-smoke-key
      LEDGERLENS_API_KEY: ci-smoke-key
      DASHBOARD_PASSWORD: ci-smoke-password
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the worker and mcp images carry PyTorch)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml config --quiet
      - name: Build images
        run: docker compose -f docker-compose.yml build
      - name: Start the stack
        run: docker compose -f docker-compose.yml up -d --wait --wait-timeout 900
      - name: Smoke test
        run: |
          set -euo pipefail
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          test "$(curl -fsS http://localhost:8000/livez)" = ok
          curl -fsS http://localhost:8000/health | tee health.json; echo
          python3 -c 'import json; h = json.load(open("health.json")); assert h["status"] == "ok", h["dependencies"]'
          test "$(status http://localhost:8000/stats/overview)" = 401
          curl -fsS -H "X-API-Key: $API_KEYS" http://localhost:8000/stats/overview > /dev/null

          curl -fsS http://localhost:3000/healthz; echo
          test "$(status http://localhost:3000/)" = 307
          test "$(status http://localhost:3000/api/health)" = 401
          # a session cookie signed the way the dashboard signs one (web/lib/session.ts)
          cookie=$(node -e '
            const crypto = require("crypto");
            const expires = Date.now() + 3600e3;
            const signature = crypto.createHmac("sha256", process.env.DASHBOARD_PASSWORD)
              .update("v1." + expires).digest("base64url");
            process.stdout.write(expires + "." + signature);')
          curl -fsS -b "ledgerlens_session=$cookie" http://localhost:3000/api/health > /dev/null
          # read the whole page first: `curl | grep -q` fails curl once grep has its match
          page=$(curl -fsS -b "ledgerlens_session=$cookie" http://localhost:3000/)
          grep -q "Documents ingested" <<< "$page"
          curl -fsS -b "ledgerlens_session=$cookie" "http://localhost:3000/api/eval/runs?limit=1"
          echo; echo "stack is up: api, worker, mcp, web"
      - name: Service status and logs
        if: always()
        run: |
          docker compose -f docker-compose.yml ps -a
          docker compose -f docker-compose.yml logs --no-color --tail 100
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml down --volumes
