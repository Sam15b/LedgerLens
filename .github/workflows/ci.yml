name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,storage]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check (mypy --strict)
        run: mypy
      - name: Unit tests with coverage
        run: pytest tests/unit --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledgerlens
      PINECONE_HOST: http://localhost:5080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,storage]"
      - name: Start services (same docker-compose.yml as local development)
        run: docker compose up -d --wait --wait-timeout 240 postgres neo4j redis pinecone-local
      - name: Wait for Pinecone Local
        run: >-
          curl --silent --show-error --fail --retry 20 --retry-connrefused --retry-delay 2
          -H "Api-Key: pclocal" -H "X-Pinecone-Api-Version: 2025-10"
          http://localhost:5080/indexes
      - name: Initialise stores
        run: |
          python scripts/create_pinecone_index.py
          python scripts/init_neo4j_schema.py
      - name: Integration tests
        run: pytest -m integration tests/integration
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop services
        if: always()
        run: docker compose down --volumes
