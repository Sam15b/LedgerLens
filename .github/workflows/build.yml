name: Build images

# Builds the four service images on every push to main and pushes them to Amazon ECR,
# tagged with the commit SHA. The deploy workflow rolls out exactly those tags, so what
# runs in the cloud is always a commit that was on main.
#
# Needs the AWS side from infra/aws (Terraform) and two repository variables:
#   AWS_REGION           e.g. us-east-1
#   AWS_BUILD_ROLE_ARN   terraform output build_role_arn (GitHub OIDC; no stored keys)
# Until AWS_BUILD_ROLE_ARN is set the job is skipped, so forks and fresh clones stay green.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # GitHub OIDC token, exchanged for short-lived AWS credentials

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false  # every main commit gets its images

jobs:
  build:
    if: vars.AWS_BUILD_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: .
            dockerfile: infra/docker/api.Dockerfile
          - service: worker
            context: .
            dockerfile: infra/docker/worker.Dockerfile
          - service: mcp
            context: .
            dockerfile: infra/docker/mcp.Dockerfile
          - service: web
            context: web
            dockerfile: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the worker and mcp images carry PyTorch)
        if: matrix.service == 'worker' || matrix.service == 'mcp'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64  # Fargate tasks run X86_64 (infra/aws)
          push: true
          # The repositories are immutable: one tag per commit, never moved.
          tags: ${{ steps.ecr.outputs.registry }}/ledgerlens/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false  # one manifest per tag keeps ECR's image list readable
      - name: Summary
        run: echo "pushed \`ledgerlens/${{ matrix.service }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
