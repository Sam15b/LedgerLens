[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerlens"
dynamic = ["version"]  # single source: src/ledgerlens/__init__.py
description = "Agentic GraphRAG system for invoices, purchase orders and contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # File loading on every upload: PDF page counts / text layer, image inspection.
    "pymupdf>=1.24",
    "pillow>=10.0",
    # Scan clean-up before OCR (deskew, denoise, binarize).
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",  # needs the tesseract binary (see ingestion/ocr/tesseract.py)
    "rapidfuzz>=3.9",  # vendor name matching
]

[project.optional-dependencies]
ingestion = [
    "sentence-transformers>=3.0",  # dense embeddings (pulls in PyTorch)
]
storage = [
    "pinecone>=10.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "alembic",
    "neo4j>=5.20",
    "redis>=5.0",
]
llm = [
    "openai",
    "google-genai",
    "mistralai",
    "ollama",
    "boto3",
]
agents = [
    "langgraph",
    "langchain-core",
    "langchain-mcp-adapters",
    "mcp",
]
ml = [
    "torch",
    "transformers",
    "peft",
    "bitsandbytes",
    "datasets",
    "diffusers",
    "tensorflow",
    "scikit-learn",
]
eval = [
    "ragas",
    "langsmith",
]
dev = [
    "boto3",  # Bedrock contract tests check requests against botocore's service model
    "pytest>=8",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pre-commit",
]

[tool.hatch.version]
path = "src/ledgerlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." so tests can import eval/ and ml/
# Integration tests need `docker compose up` and are excluded by default;
# run them with `pytest -m integration` (or `make test-int`).
addopts = "-ra -m 'not integration'"
markers = [
    "integration: needs the docker compose services (Postgres, Neo4j, Redis, Pinecone Local)",
]
filterwarnings = [
    # Third-party pytest plugin noise (langsmith on Python 3.14); not our code.
    "ignore::DeprecationWarning:langsmith.*",
]

[tool.coverage.run]
source = ["ledgerlens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep code samples in docs as written

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ledgerlens", "eval", "ml", "scripts"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
files = ["src", "tests"]
# PyMuPDF ships py.typed but leaves constructors (Document, Rect, ...) unannotated.
untyped_calls_exclude = ["pymupdf"]
# Untyped third-party packages get a per-module override instead of a global
# ignore_missing_imports, e.g.:
# [[tool.mypy.overrides]]
# module = ["pytesseract.*"]
# ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytesseract.*", "tokenizers.*"]  # untyped, or not installed by every extra
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The pre-commit mypy env has no PyTorch (a 2 GB wheel), so torch classes are Any there;
# CI's full mypy run has torch installed and checks these modules fully.
module = ["ml.synthetic.gan.*"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]  # no inline types; not installed by every extra
ignore_missing_imports = true
