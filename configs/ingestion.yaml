# Ingestion: loading, OCR, layout, chunking, embeddings, extraction.
# See docs/layers/01-ingestion.md. Validated by ledgerlens.core.config.IngestionConfig.
loader:
  max_file_mb: 25
  allowed_mime_types: [application/pdf, image/png, image/jpeg, image/tiff]
  upload_dir: data/uploads   # POST /documents stores files here; the worker reads them by path

ocr:
  engine: tesseract        # tesseract | paddle
  dpi: 300                 # rasterization DPI for scanned pages
  min_confidence: 40       # drop OCR words below this confidence (0-100)
  tesseract_psm: 6         # page segmentation mode: uniform block of text
  tesseract_cmd: null      # set to the tesseract binary path if it is not on PATH (Windows)
  preprocess:
    deskew: true
    denoise: true
    denoise_min_speckle: 0.0001  # denoise only speckled pages (isolated-pixel share); 0 = always
    median_min_speckle: 0.005    # heavy speckle: full 3x3 median; below this, despeckle isolated pixels only
    binarize: false        # Tesseract binarizes internally; doing it first measured worse

layout:
  text_layer_min_chars: 50 # fewer extractable chars than this on a page -> treat as scanned

chunking:
  context_header: true     # prefix chunks with "[INVOICE INV-889 | Vendor: ... | Date: ...]"
  contract: { max_tokens: 512, overlap: 50 }
  # invoices / POs: 1 header chunk + 1 line-items chunk; payments: 1 chunk (not configurable)

embedding:
  dense_model: BAAI/bge-base-en-v1.5
  batch_size: 32
  normalize: true
  sparse: bm25
  sparse_params_path: data/processed/bm25.json

extraction:
  # rules | llm | finetuned. Switch to finetuned once ledgerlens-llama3-lora is created in
  # Ollama and beats the rules baseline on the test split (Phase 6a exit, finetune.md).
  default: llm
  model_alias: extractor   # finetuned: training prompt, models.yaml `extractor`
  llm_alias: extractor_api # llm (and finetuned's PO / payment / contract route)
  day_first: true          # 03/04/2026 = 3 April; set false for US-style month-first dates
